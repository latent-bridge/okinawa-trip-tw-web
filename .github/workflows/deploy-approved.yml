name: 確認済みのサイトを公開
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: このリポジトリに保存した公開用tarのアセット番号
        required: true
        type: string
      sha256:
        description: チームが検証した公開用tarのSHA-256
        required: true
        type: string
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 指定した配備物の取得と照合
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
          DIGEST: ${{ inputs.sha256 }}
        run: |
          [[ "$ASSET_ID" =~ ^[0-9]+$ && "$DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" -H 'Accept: application/octet-stream' > artifact.tar
          echo "$DIGEST  artifact.tar" | sha256sum --check
          python3 - <<'PYTHON'
          import pathlib, tarfile
          with tarfile.open("artifact.tar", "r:") as archive:
              entries = archive.getmembers()
              if not entries or any(not f.isfile() or f.name.startswith("/") or ".." in pathlib.PurePosixPath(f.name).parts for f in entries):
                  raise ValueError("サイトの通常ファイルだけを指定してください")
              archive.extractall("site", members=entries, filter="data")
          PYTHON
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
          include-hidden-files: true
          retention-days: 1
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: 検証済みの内容をPagesに配備
        uses: actions/deploy-pages@v5.0.1
        id: publish
